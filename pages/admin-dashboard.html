<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Prácticas Profesionales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin-lobby.css">
</head>

<body>
  <!-- Banner -->
  <div class="banner">
    <img src="../imagenes/logo_.png" alt="Logo Universidad Autónoma del Carmen" class="logo-izquierda">
    <img src="../imagenes/logo_admin_white.png" alt="Logo Dirección General de Servicios al Estudiante" class="logo-derecha">
  </div>

  <div class="contenedor-lobby">
    <!-- IZQUIERDA: TABLA -->
    <div class="contenedor-tabla-y-botones">
      <div class="tabla-container">
        <h2 id="titulo-tabla">Listado de empresas</h2>

        <div id="estado-admin" class="alert d-none" role="alert"></div>

        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th scope="col">NOMBRE</th>
              <th scope="col">DIRECCION</th>
              <th scope="col">TELEFONO</th>
              <th scope="col">NOMBRE_CARTA</th>
              <th scope="col">PUESTO_CARTA</th>
              <th scope="col">CORREO_CONT</th>
              <th scope="col">PROGRAMA EDUCATIVO SOLICITADO</th>
              <th scope="col">GIRO DE LA EMPRESA</th>
            </tr>
          </thead>
          <tbody id="tabla-alumnos">
            <!-- Se llenará dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- DERECHA: CONTENEDOR LATERAL -->
    <div class="botones-container">
      <!-- Buscar empresa -->
      <div class="buscar-container">
        <label class="form-label" for="search">Buscar empresa:</label>
        <input
          type="text"
          id="search"
          class="form-control"
          placeholder="Buscar por nombre"
        />
      </div>

      <!-- Subir Excel -->
      <input type="file" id="excelUpload" accept=".xlsx,.xls" class="form-control mb-2 d-none" />

      <button class="btn btn-success subir-excel-btn mt-3" id="btnSubirExcel">
        Subir Excel
      </button>

      <button class="btn btn-danger eliminar-btn mt-2" id="btnEliminarTodo">
        Eliminar todo
      </button>

      <!-- ====== SECCIÓN: DESCARGAR RESPALDO EXCEL ====== -->
      <hr style="border-color: rgba(255,255,255,0.2); margin: 16px 0 12px;">

      <p style="margin-bottom: 8px; font-weight: bold; font-size: 14px;">
        Descargar respaldo Excel
      </p>

      <label for="respaldoAnio" class="form-label" style="font-size:13px; margin-bottom:3px;">
        Año:
      </label>
      <input
        type="number"
        id="respaldoAnio"
        class="form-control mb-2"
        min="2020"
        max="2100"
        placeholder="Ej. 2026"
        required
        style="font-size:13px;"
      >

      <label for="respaldoPeriodo" class="form-label" style="font-size:13px; margin-bottom:3px;">
        Periodo:
      </label>
      <select id="respaldoPeriodo" class="form-select mb-2" required style="font-size:13px;">
        <option value="">Seleccione un periodo</option>
        <option value="FEB_JUL">Febrero a julio</option>
        <option value="AGO_DIC">Agosto a diciembre</option>
      </select>

      <button class="btn btn-warning mt-1" id="btnDescargarRespaldo" style="font-size:13px;">
        💾 Descargar respaldo Excel
      </button>

      <div id="estado-respaldo" style="display:none; margin-top:8px; font-size:12px; padding:6px 8px; border-radius:4px;"></div>
      <!-- ====== FIN SECCIÓN RESPALDO ====== -->

      <button class="btn btn-danger salir-btn mt-2" id="btnSalir">
        Salir
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>

  <!-- Guard (ya lo tienes) -->
  <script src="../js/admin-guard.js"></script>

  <!-- NUEVO: lógica de admin (Excel -> BD, cargar tabla, eliminar todo, salir, descargar respaldo) -->
  <script src="../js/admin-empresas.js"></script>
</body>
</html>
